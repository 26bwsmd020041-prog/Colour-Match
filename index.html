<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Colour Match</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Colour Match</h1>
      <p class="tagline">Select the tile that exactly matches the target colour.</p>
    </header>

    <section class="hud" aria-live="polite">
      <div class="hud-left">
        <div class="score">Score: <strong id="score">0</strong></div>
        <div class="level">Level: <strong id="level">1</strong></div>
      </div>
      <div class="hud-right">
        <div class="timer">Time: <strong id="time">30</strong>s</div>
        <div class="highscore">High: <strong id="highscore">0</strong></div>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn">Start</button>
      <button id="nextBtn" disabled>Next Level</button>
      <label class="toggle"><input type="checkbox" id="patternMode"> Color-blind patterns</label>
      <label class="toggle"><input type="checkbox" id="soundToggle" checked> Sound</label>
      <button id="resetHigh">Reset High Score</button>
    </section>

    <section class="game-area">
      <div id="grid" class="grid" role="grid" aria-label="Colour selection grid"></div>
    </section>

    <footer class="footer">
      <div class="target">
        <div class="target-label">Target</div>
        <div id="targetSwatch" class="swatch" aria-live="polite" aria-atomic="true" tabindex="0"></div>
        <div id="targetHex" class="target-hex" aria-hidden="false"></div>
      </div>
      <div class="help">Click a tile or use keyboard (arrow keys + Enter) to choose the matching colour.</div>
    </footer>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="popup">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayMessage"></p>
        <div class="popup-actions">
          <button id="overlayRestart">Play Again</button>
          <button id="overlayClose">Close</button>
        </div>
      </div>
    </div>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
